name: deploy

on:
  push:
    branches: [ "main" ]

  workflow_dispatch:
  schedule:
    - cron: '17 21 * * *'

concurrency:
  group: deploy-blog
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'schedule' || vars.GOATCOUNTER_CODE != ''
    env:
      GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v3

      - name: Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Docs
        run: pnpm build

      - name: Deploy Docs
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GH_ACTIONS_TOKEN }}
          publish_dir: ./apps/blog/out
